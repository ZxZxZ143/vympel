name: Performance budgets

on:
  pull_request:
    paths:
      - "vympel_front/**"
      - "vympel_crm/**"
      - "scripts/check-performance-budgets.mjs"
      - "scripts/performance-budget-allowlist.json"
      - ".github/workflows/performance-budgets.yml"
  push:
    branches: [main]

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vympel_front/package-lock.json
            vympel_crm/package-lock.json
      - name: Build storefront
        working-directory: vympel_front
        env:
          SECURITY_HEADERS_CSP_MODE: enforce
          NEXT_PUBLIC_SITE_URL: https://shop.example.com
          SITE_INDEXING_ENABLED: "false"
          NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
          TELEMETRY_ENABLED: "false"
        run: npm ci && npm run build
      - name: Build CRM
        working-directory: vympel_crm
        env:
          SECURITY_HEADERS_CSP_MODE: enforce
          NEXT_PUBLIC_CRM_API_BASE: https://api.example.com/api/crm
          NEXT_PUBLIC_MEDIA_ORIGINS: https://media.example.com
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_APP_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
          TELEMETRY_ENABLED: "false"
        run: npm ci && npm run build
      - name: Enforce public asset and JS budgets
        working-directory: vympel_front
        run: npm run test:budgets:ci
