name: Storefront CI

on:
  push:
    branches: [main]
    paths:
      - "vympel_front/**"
      - ".env.example"
      - ".env.docker.example"
      - "scripts/check-performance-budgets.mjs"
      - "scripts/check-sharp-security.mjs"
      - "scripts/performance-budget-allowlist.json"
      - "infrastructure/**"
      - "deployment/**"
      - ".github/workflows/storefront-ci.yml"
      - ".github/workflows/full-release-gate.yml"
  pull_request:
    paths:
      - "vympel_front/**"
      - ".env.example"
      - ".env.docker.example"
      - "scripts/check-performance-budgets.mjs"
      - "scripts/check-sharp-security.mjs"
      - "scripts/performance-budget-allowlist.json"
      - "infrastructure/**"
      - "deployment/**"
      - ".github/workflows/storefront-ci.yml"
      - ".github/workflows/full-release-gate.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vympel_front
    env:
      BASE_API_PUBLIC: https://api.example.com/api/public
      NEXT_PUBLIC_BASE_API_PUBLIC: https://api.example.com/api/public
      NEXT_PUBLIC_MEDIA_ORIGINS: https://media.example.com
      NEXT_PUBLIC_SITE_URL: https://shop.example.com
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_APP_RELEASE: ${{ github.sha }}
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
      SITE_INDEXING_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vympel_front/package-lock.json
      - run: npm ci
      - run: npm ls next sharp
      - run: npm run test:sharp-security
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Enforce storefront asset and bundle budgets
        run: node ../scripts/check-performance-budgets.mjs --require-build --scope=storefront
      - name: Build storefront image
        working-directory: ${{ github.workspace }}
        run: >-
          docker build --pull
          --build-arg BASE_API_PUBLIC=https://api.example.com/api/public
          --build-arg NEXT_PUBLIC_BASE_API_PUBLIC=https://api.example.com/api/public
          --build-arg NEXT_PUBLIC_MEDIA_ORIGINS=https://media.example.com
          --build-arg NEXT_PUBLIC_SITE_URL=https://shop.example.com
          --build-arg NEXT_PUBLIC_APP_ENV=ci
          --build-arg NEXT_PUBLIC_APP_RELEASE="${GITHUB_SHA}"
          --build-arg SITE_INDEXING_ENABLED=false
          --tag "vympel-storefront:${GITHUB_SHA}"
          vympel_front
      - name: Reject actionable HIGH or CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vympel-storefront:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Verify non-local storefront bundle URLs
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --volume "${GITHUB_WORKSPACE}/deployment/scripts/verify-frontend-bundle-urls.sh:/tmp/verify-frontend-bundle-urls.sh:ro" \
            "vympel-storefront:${GITHUB_SHA}" \
            /tmp/verify-frontend-bundle-urls.sh /app/.next /app/public
