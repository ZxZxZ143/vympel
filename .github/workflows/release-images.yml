name: Release Images

on:
  push:
    branches: [main]
    paths:
      - "vympel_back/**"
      - "vympel_front/**"
      - "vympel_crm/**"
      - "compose.yml"
      - "deployment/**"
      - "infrastructure/**"
      - "scripts/check-sharp-security.mjs"
      - ".github/workflows/full-release-gate.yml"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:
    inputs:
      storefront_api_base:
        description: Browser-visible storefront API URL compiled into the image
        required: true
        default: https://api.example.invalid/api/public
        type: string
      crm_api_base:
        description: Browser-visible CRM API URL compiled into the image
        required: true
        default: https://api.example.invalid/api/crm
        type: string
      media_origins:
        description: Comma-separated browser-visible media origins
        required: true
        default: https://media.example.invalid
        type: string
      storefront_site_url:
        description: Browser-visible canonical storefront origin compiled into the image
        required: true
        default: https://shop.example.invalid
        type: string
      deployment_environment:
        description: Public environment label compiled into frontend images
        required: true
        default: staging
        type: choice
        options: [staging, production]
      publish_images:
        description: Publish all three immutable images to GHCR after every release gate passes
        required: true
        default: false
        type: boolean
      release_tag:
        description: Optional existing Git release tag that points to the dispatched commit
        required: false
        type: string
      acknowledge_placeholder_public_config:
        description: Explicitly allow reserved placeholder public URLs for a non-deployable evidence release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-images-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: ghcr.io/zxzxz143
  OCI_SOURCE: https://github.com/ZxZxZ143/vympel

jobs:
  publication_policy:
    runs-on: ubuntu-24.04
    outputs:
      publish_enabled: ${{ steps.policy.outputs.publish_enabled }}
      image_version: ${{ steps.policy.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Validate immutable publication request
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.repository.fork }}
          PUBLISH_REQUESTED: ${{ inputs.publish_images }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          STOREFRONT_API_BASE: ${{ inputs.storefront_api_base }}
          CRM_API_BASE: ${{ inputs.crm_api_base }}
          MEDIA_ORIGINS: ${{ inputs.media_origins }}
          STOREFRONT_SITE_URL: ${{ inputs.storefront_site_url }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
          ALLOW_PLACEHOLDERS: ${{ inputs.acknowledge_placeholder_public_config }}
        run: |
          set -eu
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$GITHUB_SHA" ] || ! printf '%s\n' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "The checked-out source does not match the required full commit SHA." >&2
            exit 1
          fi

          publish_enabled=false
          image_version=$GITHUB_SHA
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo "Image publication is allowed only through workflow_dispatch." >&2
              exit 1
            fi
            sh deployment/scripts/validate-public-build-config.sh \
              "$STOREFRONT_API_BASE" \
              "$CRM_API_BASE" \
              "$MEDIA_ORIGINS" \
              "$STOREFRONT_SITE_URL" \
              "$DEPLOYMENT_ENVIRONMENT" \
              "$ALLOW_PLACEHOLDERS" \
              "$GITHUB_SHA"
            if [ "$GITHUB_REPOSITORY" != "ZxZxZ143/vympel" ] || [ "$IS_FORK" = "true" ]; then
              echo "Image publication is not allowed from a fork or another repository." >&2
              exit 1
            fi
            if [ -n "$RELEASE_TAG" ]; then
              if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
                echo "Release tag must use a version such as v1.0.0-rc.2." >&2
                exit 1
              fi
              if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
                echo "Dispatch the workflow from the exact release tag ref." >&2
                exit 1
              fi
              tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
              if [ "$tag_commit" != "$GITHUB_SHA" ]; then
                echo "Release tag does not resolve to the dispatched commit." >&2
                exit 1
              fi
              image_version=$RELEASE_TAG
            fi
            publish_enabled=true
          elif [ -n "$RELEASE_TAG" ]; then
            echo "release_tag is accepted only when publish_images is true." >&2
            exit 1
          fi

          echo "publish_enabled=$publish_enabled" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"

  publication_gate:
    needs: publication_policy
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    uses: ./.github/workflows/full-release-gate.yml

  build:
    needs: publication_policy
    if: needs.publication_policy.outputs.publish_enabled != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vympel-backend
            context: vympel_back
            dockerfile: vympel_back/Dockerfile
            build_args: ""
          - image: vympel-storefront
            context: vympel_front
            dockerfile: vympel_front/Dockerfile
            build_args: |
              BASE_API_PUBLIC=${{ inputs.storefront_api_base || 'https://api.example.invalid/api/public' }}
              NEXT_PUBLIC_BASE_API_PUBLIC=${{ inputs.storefront_api_base || 'https://api.example.invalid/api/public' }}
              NEXT_PUBLIC_MEDIA_ORIGINS=${{ inputs.media_origins || 'https://media.example.invalid' }}
              NEXT_PUBLIC_SITE_URL=${{ inputs.storefront_site_url || 'https://shop.example.invalid' }}
              NEXT_PUBLIC_APP_ENV=${{ inputs.deployment_environment || 'ci' }}
              NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
              NEXT_PUBLIC_TELEMETRY_ENABLED=false
          - image: vympel-crm
            context: vympel_crm
            dockerfile: vympel_crm/Dockerfile
            build_args: |
              NEXT_PUBLIC_CRM_API_BASE=${{ inputs.crm_api_base || 'https://api.example.invalid/api/crm' }}
              NEXT_PUBLIC_MEDIA_ORIGINS=${{ inputs.media_origins || 'https://media.example.invalid' }}
              NEXT_PUBLIC_APP_ENV=${{ inputs.deployment_environment || 'ci' }}
              NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
              NEXT_PUBLIC_TELEMETRY_ENABLED=false
    env:
      IMAGE_REPOSITORY: ghcr.io/zxzxz143/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Generate immutable tags and OCI labels
        id: metadata
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }},priority=1000
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }},priority=900
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.publication_policy.outputs.image_version }}
            org.opencontainers.image.title=${{ matrix.image }}
      - name: Build immutable image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publication_preflight:
    needs: [publication_policy, publication_gate]
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject every existing immutable image tag before fan-out
        run: |
          set -eu
          tags=$GITHUB_SHA
          if [ -n "$RELEASE_TAG" ]; then
            tags="$tags $RELEASE_TAG"
          fi
          for image in vympel-backend vympel-storefront vympel-crm; do
            repository="ghcr.io/zxzxz143/$image"
            for tag in $tags; do
              error_file=$(mktemp)
              if docker buildx imagetools inspect "$repository:$tag" > /dev/null 2>"$error_file"; then
                echo "Refusing to overwrite existing immutable image tag: $repository:$tag" >&2
                rm -f "$error_file"
                exit 1
              fi
              if ! grep -Eiq 'not found|manifest unknown|no such manifest' "$error_file"; then
                echo "Could not prove that immutable image tag is absent: $repository:$tag" >&2
                sed -E 's/(token|password|authorization)[^ ]*/[REDACTED]/Ig' "$error_file" >&2
                rm -f "$error_file"
                exit 1
              fi
              rm -f "$error_file"
            done
          done

  publish_backend:
    needs:
      - publication_policy
      - publication_gate
      - publication_preflight
      - publish_storefront
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790
    with:
      job-name-prefix: vympel-backend
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      context: ./vympel_back
      file: ./Dockerfile
      cache: true
      cache-mode: max
      cache-scope: vympel-backend
      sbom: true
      sign: auto
      meta-images: ghcr.io/zxzxz143/vympel-backend
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=${{ github.sha }},priority=1000
        type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }},priority=900
      labels: |
        org.opencontainers.image.source=https://github.com/ZxZxZ143/vympel
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.publication_policy.outputs.image_version }}
        org.opencontainers.image.title=vympel-backend
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  publish_storefront:
    needs: [publication_policy, publication_gate, publication_preflight]
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790
    with:
      job-name-prefix: vympel-storefront
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      context: ./vympel_front
      file: ./Dockerfile
      build-args: |
        BASE_API_PUBLIC=${{ inputs.storefront_api_base }}
        NEXT_PUBLIC_BASE_API_PUBLIC=${{ inputs.storefront_api_base }}
        NEXT_PUBLIC_MEDIA_ORIGINS=${{ inputs.media_origins }}
        NEXT_PUBLIC_SITE_URL=${{ inputs.storefront_site_url }}
        NEXT_PUBLIC_APP_ENV=${{ inputs.deployment_environment }}
        NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
        NEXT_PUBLIC_TELEMETRY_ENABLED=false
      cache: true
      cache-mode: max
      cache-scope: vympel-storefront
      sbom: true
      sign: auto
      meta-images: ghcr.io/zxzxz143/vympel-storefront
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=${{ github.sha }},priority=1000
        type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }},priority=900
      labels: |
        org.opencontainers.image.source=https://github.com/ZxZxZ143/vympel
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.publication_policy.outputs.image_version }}
        org.opencontainers.image.title=vympel-storefront
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  publish_crm:
    needs:
      - publication_policy
      - publication_gate
      - publication_preflight
      - publish_storefront
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790
    with:
      job-name-prefix: vympel-crm
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      context: ./vympel_crm
      file: ./Dockerfile
      build-args: |
        NEXT_PUBLIC_CRM_API_BASE=${{ inputs.crm_api_base }}
        NEXT_PUBLIC_MEDIA_ORIGINS=${{ inputs.media_origins }}
        NEXT_PUBLIC_APP_ENV=${{ inputs.deployment_environment }}
        NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
        NEXT_PUBLIC_TELEMETRY_ENABLED=false
      cache: true
      cache-mode: max
      cache-scope: vympel-crm
      sbom: true
      sign: auto
      meta-images: ghcr.io/zxzxz143/vympel-crm
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=${{ github.sha }},priority=1000
        type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }},priority=900
      labels: |
        org.opencontainers.image.source=https://github.com/ZxZxZ143/vympel
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.publication_policy.outputs.image_version }}
        org.opencontainers.image.title=vympel-crm
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  attest_published_indexes:
    needs: [publication_policy, publish_backend, publish_storefront, publish_crm]
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vympel-backend
            digest: ${{ needs.publish_backend.outputs.digest }}
          - image: vympel-storefront
            digest: ${{ needs.publish_storefront.outputs.digest }}
          - image: vympel-crm
            digest: ${{ needs.publish_crm.outputs.digest }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate signed GitHub provenance for the final OCI index
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ghcr.io/zxzxz143/${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
          create-storage-record: false

  record_published_metadata:
    needs:
      - publication_policy
      - publish_backend
      - publish_storefront
      - publish_crm
      - attest_published_indexes
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BACKEND_DIGEST: ${{ needs.publish_backend.outputs.digest }}
      STOREFRONT_DIGEST: ${{ needs.publish_storefront.outputs.digest }}
      CRM_DIGEST: ${{ needs.publish_crm.outputs.digest }}
      BACKEND_SIGNED: ${{ needs.publish_backend.outputs.signed }}
      STOREFRONT_SIGNED: ${{ needs.publish_storefront.outputs.signed }}
      CRM_SIGNED: ${{ needs.publish_crm.outputs.signed }}
      PUBLIC_STOREFRONT_API_BASE: ${{ inputs.storefront_api_base }}
      PUBLIC_CRM_API_BASE: ${{ inputs.crm_api_base }}
      PUBLIC_MEDIA_ORIGINS: ${{ inputs.media_origins }}
      PUBLIC_STOREFRONT_SITE_URL: ${{ inputs.storefront_site_url }}
      PUBLIC_DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
      PLACEHOLDER_ACKNOWLEDGED: ${{ inputs.acknowledge_placeholder_public_config }}
    steps:
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify indexes and record release metadata
        run: |
          set -eu
          if [ "$BACKEND_SIGNED" != "true" ] ||
             [ "$STOREFRONT_SIGNED" != "true" ] ||
             [ "$CRM_SIGNED" != "true" ]; then
            echo "Docker GitHub Builder did not report signed attestation manifests." >&2
            exit 1
          fi

          mkdir -p release-metadata
          for image in vympel-backend vympel-storefront vympel-crm; do
            repository="ghcr.io/zxzxz143/$image"
            case "$image" in
              vympel-backend) expected_digest=$BACKEND_DIGEST ;;
              vympel-storefront) expected_digest=$STOREFRONT_DIGEST ;;
              vympel-crm) expected_digest=$CRM_DIGEST ;;
            esac

            remote_digest=$(docker buildx imagetools inspect "$repository:$GITHUB_SHA" |
              awk '$1 == "Digest:" { print $2; exit }')
            if [ "$remote_digest" != "$expected_digest" ]; then
              echo "SHA-tag digest does not match the distributed builder output for $image." >&2
              exit 1
            fi
            if [ -n "$RELEASE_TAG" ]; then
              release_digest=$(docker buildx imagetools inspect "$repository:$RELEASE_TAG" |
                awk '$1 == "Digest:" { print $2; exit }')
              if [ "$release_digest" != "$expected_digest" ]; then
                echo "Release-tag digest does not match the SHA-tag digest for $image." >&2
                exit 1
              fi
            fi

            manifest_json=$(docker buildx imagetools inspect "$repository:$GITHUB_SHA" --raw)
            amd64_digest=$(printf '%s\n' "$manifest_json" | jq -er '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest]
              | select(length == 1) | .[0]')
            arm64_digest=$(printf '%s\n' "$manifest_json" | jq -er '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest]
              | select(length == 1) | .[0]')
            for digest in "$expected_digest" "$amd64_digest" "$arm64_digest"; do
              printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            done

            jq -n \
              --arg image "$image" \
              --arg repository "$repository" \
              --arg tag "$GITHUB_SHA" \
              --arg releaseTag "$RELEASE_TAG" \
              --arg digest "$expected_digest" \
              --arg commit "$GITHUB_SHA" \
              --arg amd64Digest "$amd64_digest" \
              --arg arm64Digest "$arm64_digest" \
              --arg storefrontApiBase "$PUBLIC_STOREFRONT_API_BASE" \
              --arg crmApiBase "$PUBLIC_CRM_API_BASE" \
              --arg mediaOrigins "$PUBLIC_MEDIA_ORIGINS" \
              --arg storefrontSiteUrl "$PUBLIC_STOREFRONT_SITE_URL" \
              --arg deploymentEnvironment "$PUBLIC_DEPLOYMENT_ENVIRONMENT" \
              --arg placeholderAcknowledged "$PLACEHOLDER_ACKNOWLEDGED" \
              '{
                image: $image,
                repository: $repository,
                tag: $tag,
                releaseTag: (if $releaseTag == "" then null else $releaseTag end),
                digest: $digest,
                commit: $commit,
                pushed: true,
                signedAttestations: true,
                platforms: {
                  "linux/amd64": $amd64Digest,
                  "linux/arm64": $arm64Digest
                },
                publicBuildConfiguration: {
                  strategy: "build-time-release-contract",
                  storefrontApiBase: $storefrontApiBase,
                  crmApiBase: $crmApiBase,
                  mediaOrigins: $mediaOrigins,
                  storefrontSiteUrl: $storefrontSiteUrl,
                  deploymentEnvironment: $deploymentEnvironment,
                  release: $commit,
                  placeholderAcknowledged: ($placeholderAcknowledged == "true")
                }
              }' > "release-metadata/$image.json"
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: image-metadata-published-${{ github.sha }}
          path: release-metadata/*.json
          if-no-files-found: error
          retention-days: 90

  verify_published_images:
    needs: [publication_policy, record_published_metadata]
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REGISTRY: ghcr.io/zxzxz143
      RELEASE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: vympel-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: image-metadata-*-${{ github.sha }}
          path: release-metadata
          merge-multiple: true
      - name: Pull and inspect exact SHA-tagged images
        run: sh deployment/scripts/verify-published-images.sh release-metadata "$GITHUB_SHA"
      - name: Run isolated published-image Compose verification
        run: |
          set -eu
          cleanup() {
            docker compose \
              -f compose.yml \
              -f deployment/rehearsals/compose.published-images.yml \
              down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            up -d --no-build --wait --wait-timeout 300
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
          test "$(curl --fail --silent --show-error http://127.0.0.1:3200/ru | wc -c)" -gt 500
          test "$(curl --fail --silent --show-error http://127.0.0.1:3201/login | wc -c)" -gt 500
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            exec -T public \
            node -e "fetch('http://backend:8080/api/public/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            exec -T crm \
            node -e "fetch('http://backend:8080/api/public/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            ps

  verify_arm64_images:
    needs: [publication_policy, record_published_metadata]
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      REGISTRY: ghcr.io/zxzxz143
      RELEASE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: vympel-ghcr-arm64-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: image-metadata-*-${{ github.sha }}
          path: release-metadata
          merge-multiple: true
      - name: Verify the OCI index and both child manifests
        run: sh deployment/scripts/verify-published-images.sh release-metadata "$GITHUB_SHA"
      - name: Run the exact ARM64 images with migrations and readiness checks
        run: |
          set -eu
          cleanup() {
            docker compose \
              -f compose.yml \
              -f deployment/rehearsals/compose.published-images.yml \
              -f deployment/rehearsals/compose.arm64-images.yml \
              down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            -f deployment/rehearsals/compose.arm64-images.yml \
            up -d --no-build --wait --wait-timeout 900
          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
          test "$(curl --fail --silent --show-error http://127.0.0.1:3200/ru | wc -c)" -gt 500
          test "$(curl --fail --silent --show-error http://127.0.0.1:3201/login | wc -c)" -gt 500
          test "$(curl --fail --silent --show-error \
            'http://127.0.0.1:3200/_next/image?url=%2Fcatalog-hero-banner.jpg&w=64&q=75' | wc -c)" -gt 100
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            -f deployment/rehearsals/compose.arm64-images.yml \
            exec -T backend \
            sh -c 'test "$(uname -m)" = aarch64 && java -XshowSettings:properties -version 2>&1 | grep -q "os.arch = aarch64"'
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            -f deployment/rehearsals/compose.arm64-images.yml \
            exec -T public \
            node -e "const sharp=require('sharp'); if(process.arch!=='arm64') process.exit(1); sharp({create:{width:2,height:2,channels:3,background:'#fff'}}).webp().toBuffer().then(b=>process.exit(b.length>0?0:1)).catch(()=>process.exit(1))"
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            -f deployment/rehearsals/compose.arm64-images.yml \
            exec -T crm \
            node -e "const sharp=require('sharp'); if(process.arch!=='arm64') process.exit(1); sharp({create:{width:2,height:2,channels:3,background:'#fff'}}).webp().toBuffer().then(b=>process.exit(b.length>0?0:1)).catch(()=>process.exit(1))"
          docker compose \
            -f compose.yml \
            -f deployment/rehearsals/compose.published-images.yml \
            -f deployment/rehearsals/compose.arm64-images.yml \
            ps

  published_manifest:
    needs: [publication_policy, verify_published_images, verify_arm64_images]
    if: needs.publication_policy.outputs.publish_enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: image-metadata-*-${{ github.sha }}
          path: release-metadata
          merge-multiple: true
      - name: Generate digest-pinned release manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sh deployment/scripts/generate-published-release-manifest.sh \
            release-metadata \
            release-metadata/published-release.yml \
            "$GITHUB_SHA" \
            "$RELEASE_TAG" \
            "$RELEASE_RUN_URL"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: published-release-manifest-${{ github.sha }}
          path: release-metadata/published-release.yml
          if-no-files-found: error
          retention-days: 180

  publication_result:
    needs:
      - publication_policy
      - build
      - publish_backend
      - publish_storefront
      - publish_crm
      - verify_published_images
      - verify_arm64_images
      - published_manifest
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report release boundary result
        env:
          PUBLISH_ENABLED: ${{ needs.publication_policy.outputs.publish_enabled }}
          BUILD_RESULT: ${{ needs.build.result }}
          BACKEND_PUBLISH_RESULT: ${{ needs.publish_backend.result }}
          STOREFRONT_PUBLISH_RESULT: ${{ needs.publish_storefront.result }}
          CRM_PUBLISH_RESULT: ${{ needs.publish_crm.result }}
          VERIFY_RESULT: ${{ needs.verify_published_images.result }}
          ARM64_VERIFY_RESULT: ${{ needs.verify_arm64_images.result }}
          MANIFEST_RESULT: ${{ needs.published_manifest.result }}
        run: |
          set -eu
          if [ "$PUBLISH_ENABLED" = "true" ]; then
            if [ "$BACKEND_PUBLISH_RESULT" != "success" ] ||
               [ "$STOREFRONT_PUBLISH_RESULT" != "success" ] ||
               [ "$CRM_PUBLISH_RESULT" != "success" ] ||
               [ "$VERIFY_RESULT" != "success" ] ||
               [ "$ARM64_VERIFY_RESULT" != "success" ] ||
               [ "$MANIFEST_RESULT" != "success" ]; then
              echo "Published amd64/ARM64 verification or digest-manifest generation failed." >&2
              exit 1
            fi
            echo "All three GHCR images were published and verified. No deployment was performed."
          else
            if [ "$BUILD_RESULT" != "success" ]; then
              echo "Native amd64 image build failed." >&2
              exit 1
            fi
            echo "All three images built without registry login or publication."
          fi
