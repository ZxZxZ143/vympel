# Only application-owned public image paths receive a cache policy. UUID originals
# are insert-only; responsive-v1 additionally carries the source SHA-256. Do not
# extend these expressions to arbitrary buckets/keys, signed requests or APIs.
map $uri $vympel_image_cache {
    default "";
    "~^/[^/]+/(product|cms)/[a-f0-9-]{36}\.(png|jpe?g|gif)$" "public, max-age=3600";
    "~^/[^/]+/(product|cms)/responsive-v1/[a-f0-9-]{36}/[a-f0-9]{64}/[0-9]+x[0-9]+/(original\.(png|jpe?g)|w[0-9]+\.webp)$" "public, max-age=31536000, immutable";
}

map $upstream_http_cache_control $vympel_origin_cache {
    "" $vympel_image_cache;
    default $upstream_http_cache_control;
}

map "$http_authorization:$args" $vympel_access_cache {
    default "private, no-store";
    ":" $vympel_origin_cache;
    ~^:v=[a-zA-Z0-9.%_~-]+$ $vympel_origin_cache;
}

map $upstream_status $vympel_response_cache {
    default "";
    ~^(200|206|304)$ $vympel_access_cache;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_pass http://minio:9000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $vympel_response_cache;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
