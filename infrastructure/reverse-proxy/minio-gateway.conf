server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_pass http://minio:9000;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
